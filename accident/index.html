<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職業災害分析系統 | 大豐環保科技</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/components.css">
<style>
:root {
  --navy:   var(--ohs-navy);
  --bg:     var(--ohs-bg);
  --card:   var(--ohs-card);
  --border: var(--ohs-border);
  --text:   var(--ohs-text);
  --sub:    var(--ohs-muted);
  --red:    var(--ohs-red);
  --orange: var(--ohs-orange);
  --green:  var(--ohs-green);
  --blue:   var(--ohs-blue);
  --amber:  var(--ohs-amber);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* ── header ── */
header{background:linear-gradient(135deg,#2d0000 0%,#7f1d1d 50%,#dc2626 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.35);}
header h1{font-size:18px;font-weight:700;}
.hdr-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;transition:background .15s;flex-shrink:0;}
.hdr-btn:hover{background:rgba(255,255,255,.2);}
.hdr-brand{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0;}
.hdr-brand img{height:24px;object-fit:contain;}
.hdr-brand span{font-size:12px;color:#94a3b8;font-weight:600;white-space:nowrap;}

/* ── filter bar ── */
#fbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 24px;
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06);}
#fbar label{font-size:12px;font-weight:700;color:var(--sub);}
#fbar select{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;background:var(--bg);outline:none;font-family:inherit;cursor:pointer;}
#fbar select:focus{border-color:var(--orange);}
.fsep{width:1px;height:20px;background:var(--border);}
#rst-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;color:var(--sub);}
#rst-btn:hover{background:#e2e8f0;}

/* ── main ── */
main{max-width:1280px;margin:0 auto;padding:24px;}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.kpi{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid transparent;}
.kpi.red  {border-left-color:var(--red);}
.kpi.org  {border-left-color:var(--orange);}
.kpi.blue {border-left-color:var(--blue);}
.kpi.amb  {border-left-color:var(--amber);}
.kpi-lbl{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;}
.kpi-val{font-size:30px;font-weight:900;line-height:1;}
.kpi-sub{font-size:11px;color:var(--sub);margin-top:5px;}

/* ── chart cards ── */
.cc{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;}
.g2 {display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:20px;}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.g2 .cc,.g2b .cc{margin-bottom:0;}
.ct{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* toggle */
.tgg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-left:auto;}
.tgg button{padding:4px 12px;font-size:12px;border:none;background:var(--bg);cursor:pointer;color:var(--sub);transition:background .15s;}
.tgg button.on{background:var(--navy);color:#fff;}

/* ── FR/SR table ── */
.ftbl{width:100%;border-collapse:collapse;font-size:13px;}
.ftbl th{background:var(--navy);color:#fff;padding:8px 12px;text-align:center;font-weight:600;}
.ftbl td{padding:7px 12px;text-align:center;border-bottom:1px solid var(--border);}
.ftbl tr:nth-child(even) td{background:#f8fafc;}
.vfr{font-weight:700;color:var(--orange);}
.vsr{font-weight:700;color:var(--red);}
.vdi{font-weight:700;color:var(--blue);}
.note{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6;}

/* ── data table ── */
.tbl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
#tsrch{border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:13px;width:240px;outline:none;font-family:inherit;}
#tsrch:focus{border-color:var(--orange);}
#tct{font-size:12px;color:var(--sub);margin-left:auto;}
.tw{overflow-x:auto;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
table{width:100%;border-collapse:collapse;background:var(--card);}
thead th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-size:12px;white-space:nowrap;}
tbody td{padding:7px 12px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover td{background:#f0f9ff;}
.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.bd-r{background:#fee2e2;color:#b91c1c;}
.bd-b{background:#dbeafe;color:#1d4ed8;}
.bd-o{background:#ffedd5;color:#c2410c;}
.bd-g{background:#f1f5f9;color:var(--sub);}
.dv{font-weight:700;color:var(--orange);}

/* ── pager ── */
.pgr{display:flex;gap:5px;align-items:center;margin-top:12px;justify-content:center;}
.pgr button{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);cursor:pointer;font-size:12px;}
.pgr button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.pgr button:hover:not(.on){background:var(--bg);}
.pgi{font-size:12px;color:var(--sub);}

/* ── loading ── */
#loading{text-align:center;padding:80px 24px;font-size:15px;color:var(--sub);line-height:2;}

@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}.g2,.g2b{grid-template-columns:1fr;}}
@media(max-width:500px){.kpi-row{grid-template-columns:1fr;}}

/* ── Detail Modal ── */
tbody tr{cursor:pointer;}
.dtl-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;}
.dtl-bg.open{display:flex;}
.dtl-card{background:var(--card);border-radius:14px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.dtl-hdr{padding:16px 22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.dtl-hdr-title{font-size:15px;font-weight:700;}
.dtl-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.dtl-close:hover{background:rgba(255,255,255,.28);}
.dtl-body{flex:1;overflow-y:auto;padding:20px 22px;}
.dtl-sec{margin-bottom:20px;}
.dtl-sec-hd{font-size:10px;font-weight:800;color:#fff;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:12px;padding:5px 10px;border-radius:5px;background:var(--navy);display:inline-block;}
.dtl-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
.dtl-g1{display:grid;grid-template-columns:1fr;gap:12px;}
.dtl-lbl{font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:3px;letter-spacing:.5px;}
.dtl-val{font-size:13px;color:#0f172a;font-weight:600;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.dtl-mute{font-size:13px;color:#cbd5e1;font-style:italic;}

/* ── Import Upload ── */
.btn-upload{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;margin-left:auto;}
.btn-upload:hover{background:rgba(255,255,255,.28);}
.imp-bg{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;}
.imp-bg.open{display:flex;}
.imp-card{background:var(--card);border-radius:14px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.imp-hdr{padding:16px 22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.imp-hdr-title{font-size:15px;font-weight:700;}
.imp-body{flex:1;overflow-y:auto;padding:20px 22px;}
.imp-stat{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.imp-stat-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;}
.imp-new{background:#dcfce7;color:#166534;}
.imp-skip{background:#f1f5f9;color:#64748b;}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.imp-tbl th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;}
.imp-tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.imp-tbl tr.skip-row td{color:#94a3b8;}
.imp-foot{padding:16px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);flex-shrink:0;}

/* ── Detail Modal 加寬（容納 AI 三欄） ── */
.dtl-card{max-width:780px!important;}

/* ── AI 根因分析區塊 ── */
.ai-gen-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;background:#7c3aed;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;}
.ai-gen-btn:hover{background:#6d28d9;}
.ai-gen-btn:disabled{opacity:.5;cursor:default;}
.ai-5why{margin-bottom:14px;}
.ai-5why-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.ai-5why-num{background:#7c3aed;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px;}
.ai-5why-q{font-size:11px;color:var(--sub);margin-bottom:2px;}
.ai-5why-a{font-size:12.5px;color:var(--text);font-weight:600;}
.ai-dim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.ai-dim-card{border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;}
.ai-dim-eng{background:#eff6ff;border-left:3px solid #2563eb;}
.ai-dim-mgmt{background:#fff7ed;border-left:3px solid #ea580c;}
.ai-dim-train{background:#f0fdf4;border-left:3px solid #16a34a;}
.ai-dim-title{font-weight:700;font-size:11px;margin-bottom:6px;color:var(--text);}
.ai-dim-item{margin-bottom:3px;color:var(--text);}
.ai-dim-item::before{content:'• ';}
.ai-save-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);flex-wrap:wrap;}
.ai-save-btn{padding:6px 16px;background:#059669;border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;}
.ai-save-btn:hover{background:#047857;}
.ai-save-btn:disabled{opacity:.5;cursor:default;}
.ai-saved-tag{font-size:11px;color:#059669;font-weight:700;}
.ai-regen-btn{font-size:11px;color:var(--sub);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
.ai-sub-lbl{font-size:11px;color:var(--sub);margin-bottom:8px;}
@media(max-width:600px){.ai-dim-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header class="ohs-header">
  <button class="hdr-btn" onclick="location.href='../'" title="回到職安管理系統入口">← 系統入口</button>
  <h1>📊 職業災害分析系統</h1>
  <div class="hdr-brand">
    <img src="../dafon-logo.png" alt="大豐環保科技">
    <span>大豐環保科技</span>
  </div>
  <label class="btn-upload" for="bpm-file-input" title="上傳 BPM 匯出的 XLSX，自動同步職災紀錄">📂 上傳 BPM 資料</label>
  <input id="bpm-file-input" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="onBpmUpload(this)">
</header>

<div id="fbar" style="display:none">
  <label>年度</label>
  <select id="fy" onchange="go()"><option value="">全部</option></select>
  <label>季度</label>
  <select id="fq" onchange="go()">
    <option value="">全部</option>
    <option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option>
  </select>
  <label>事故分類</label>
  <select id="fc" onchange="go()"><option value="">全部</option></select>
  <span class="fsep"></span>
  <label>部門</label>
  <select id="fd" onchange="go()"><option value="">全部</option></select>
  <button id="rst-btn" onclick="rst()">✕ 重設</button>
</div>

<div id="loading">⏳ 資料載入中，請稍候…</div>

<main id="app" style="display:none">

  <!-- KPI -->
  <div class="kpi-row">
    <div class="kpi red">
      <div class="kpi-lbl">總事故件數</div>
      <div class="kpi-val" id="k1">—</div>
      <div class="kpi-sub" id="k1s"></div>
    </div>
    <div class="kpi org">
      <div class="kpi-lbl">失能傷害件數</div>
      <div class="kpi-val" id="k2">—</div>
      <div class="kpi-sub">預估休息天數 &gt; 0</div>
    </div>
    <div class="kpi blue">
      <div class="kpi-lbl">失能傷害頻率 FR</div>
      <div class="kpi-val" id="k3">—</div>
      <div class="kpi-sub" id="k3s">每百萬工時</div>
    </div>
    <div class="kpi amb">
      <div class="kpi-lbl">失能傷害嚴重率 SR</div>
      <div class="kpi-val" id="k4">—</div>
      <div class="kpi-sub" id="k4s">每百萬工時</div>
    </div>
  </div>

  <!-- 趨勢 -->
  <div class="cc">
    <div class="ct">
      事故件數趨勢
      <div class="tgg">
        <button id="bm" class="on" onclick="setM('m')">月</button>
        <button id="bq" onclick="setM('q')">季</button>
      </div>
    </div>
    <div style="position:relative;height:230px"><canvas id="ctrend"></canvas></div>
  </div>

  <!-- 部門 + 類型 -->
  <div class="g2">
    <div class="cc">
      <div class="ct">各部門事故件數</div>
      <div style="position:relative;height:300px"><canvas id="cdept"></canvas></div>
    </div>
    <div class="cc">
      <div class="ct">事故類型占比</div>
      <div style="position:relative;height:300px"><canvas id="ctype"></canvas></div>
    </div>
  </div>

  <!-- FR/SR -->
  <div class="g2b">
    <div class="cc">
      <div class="ct">年度 FR / SR 統計表</div>
      <table class="ftbl" id="ftbl"></table>
      <div class="note">
        ＊2022年資料不完整，不計入 FR/SR<br>
        ＊FR/SR 為全公司年度指標，不受上方篩選器影響
      </div>
    </div>
    <div class="cc">
      <div class="ct">FR / SR 年度趨勢</div>
      <div style="position:relative;height:240px"><canvas id="cfrsr"></canvas></div>
    </div>
  </div>

  <!-- 明細表 -->
  <div class="cc">
    <div class="ct">📋 事故明細清單</div>
    <div class="tbl-top">
      <input type="text" id="tsrch" placeholder="🔍 搜尋部門、類型、地點、姓名…" oninput="rtbl()">
      <span id="tct"></span>
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th>發生日期</th><th>部門</th><th>事發地點</th>
          <th>事故分類</th><th>事故類型</th><th>休息天數</th><th>是否懲處</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pgr" id="pgr"></div>
  </div>

</main>

<!-- Import Preview Modal -->
<div class="imp-bg" id="imp-bg" onclick="if(event.target===this)closeImport()">
  <div class="imp-card">
    <div class="imp-hdr">
      <span class="imp-hdr-title">📂 確認寫入 BPM 資料</span>
      <button type="button" class="dtl-close" onclick="closeImport()">✕</button>
    </div>
    <div class="imp-body" id="imp-body"></div>
    <div class="imp-foot">
      <button type="button" class="ohs-btn ohs-btn-outline" onclick="closeImport()">取消</button>
      <button type="button" class="ohs-btn ohs-btn-primary" id="imp-confirm-btn" onclick="confirmImport()">確認寫入 →</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="dtl-bg" id="dtl-bg" onclick="closeDtl()">
  <div class="dtl-card" onclick="event.stopPropagation()">
    <div class="dtl-hdr">
      <span class="dtl-hdr-title">📋 事故詳細資料</span>
      <button class="dtl-close" onclick="closeDtl()">✕</button>
    </div>
    <div class="dtl-body" id="dtl-body"></div>
  </div>
</div>

<script>
// ── 設定：填入 Apps Script 部署後的網址 ──────────────────────
const DATA_URL = 'https://script.google.com/macros/s/AKfycbxpgGnRKUtNPK6WmOYtnl_It4pOizk5a1UDbx9QmW8VOYU2mTZtln0FSx6Dbywpaagk2w/exec';

const PG = 20;
let ALL = [], FRSR = {}, mode = 'm', pg = 1, CH = {}, _dr = [];

// ── BPM 資料上傳（取代 import_accidents.py）────────────────────
let _importRows = [];

function _normDate(v) {
  const s = String(v || '').replace(/[^0-9]/g, '');
  return s.length === 8 ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}` : String(v || '');
}
function _normEmpId(v) {
  const s = String(v || '').trim();
  return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s;
}
function _rowKey(r) {
  return _normDate(r['發生日期']) + '|' + _normEmpId(r['員工工號'] || '');
}

async function onBpmUpload(input) {
  const file = input.files[0]; if (!file) return;
  input.value = '';
  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab, { type: 'array', raw: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
    if (!rows.length) { alert('檔案內沒有資料，請確認格式。'); return; }

    rows.forEach(r => {
      r['發生日期']     = _normDate(r['發生日期']);
      r['改善完成日期'] = _normDate(r['改善完成日期'] || '');
    });

    const existingKeys = new Set(ALL.map(a => a.date + '|' + _normEmpId(a.empId)));
    const newRows  = rows.filter(r => !existingKeys.has(_rowKey(r)));
    const skipRows = rows.filter(r =>  existingKeys.has(_rowKey(r)));
    _importRows = newRows;
    openImportPreview(newRows, skipRows);
  } catch(e) {
    alert('無法解析檔案：' + e.message);
    console.error('[BPM Upload]', e);
  }
}

function openImportPreview(newRows, skipRows) {
  const allRows = [...newRows, ...skipRows];
  const rowHtml = allRows.map(r => {
    const isSkip = skipRows.includes(r);
    return `<tr class="${isSkip ? 'skip-row' : ''}">
      <td>${_esc(r['發生日期'])}</td>
      <td>${_esc(r['員工姓名'])}</td>
      <td>${_esc(r['事故類型'])}</td>
      <td>${_esc(r['事發地點'] || '')}</td>
      <td>${_esc(String(r['預估休息天數'] || 0))}</td>
      <td>${isSkip ? '<span style="color:#94a3b8">略過</span>' : '<span style="color:#166534">✓ 新增</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById('imp-body').innerHTML = `
    <div class="imp-stat">
      <span class="imp-stat-chip imp-new">✅ 新增：${newRows.length} 筆</span>
      ${skipRows.length ? `<span class="imp-stat-chip imp-skip">⏭ 已存在（略過）：${skipRows.length} 筆</span>` : ''}
    </div>
    <div style="max-height:360px;overflow-y:auto">
      <table class="imp-tbl">
        <thead><tr><th>發生日期</th><th>姓名</th><th>事故類型</th><th>地點</th><th>休息天數</th><th>狀態</th></tr></thead>
        <tbody>${rowHtml}</tbody>
      </table>
    </div>`;

  const btn = document.getElementById('imp-confirm-btn');
  btn.disabled = newRows.length === 0;
  btn.textContent = newRows.length ? `確認寫入 ${newRows.length} 筆 →` : '無新資料';
  document.getElementById('imp-bg').classList.add('open');
}

function closeImport() {
  document.getElementById('imp-bg').classList.remove('open');
}

async function confirmImport() {
  if (!_importRows.length) return;
  const btn = document.getElementById('imp-confirm-btn');
  btn.disabled = true; btn.textContent = '⏳ 寫入中…';
  try {
    const res = await fetch(DATA_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'append', rows: _importRows })
    });
    const j = await res.json();
    if (j.added !== undefined) {
      closeImport();
      alert(`✅ 成功新增 ${j.added} 筆！頁面即將重新載入。`);
      location.reload();
    } else {
      throw new Error(j.error || '未知錯誤');
    }
  } catch(e) {
    btn.disabled = false; btn.textContent = '重試';
    alert('寫入失敗：' + e.message);
    console.error('[confirmImport]', e);
  }
}

// ── 載入 ────────────────────────────────────────────────────
async function init() {
  try {
    const j = await fetch(DATA_URL).then(r => r.json());
    ALL  = j.accidents;
    FRSR = j.frsr;
    buildFilters();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('fbar').style.display    = 'flex';
    document.getElementById('app').style.display     = 'block';
    go();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '⚠️ 資料載入失敗<br><br>' +
      '請確認已完成以下步驟：<br>' +
      '1. Apps Script 已部署為「網路應用程式」<br>' +
      '2. 存取設定為「所有人」<br>' +
      '3. 將部署網址填入 accident/index.html 的 DATA_URL<br><br>' +
      '<small style="color:#94a3b8">' + e.message + '</small>';
  }
}

// ── 篩選器初始化 ─────────────────────────────────────────────
function buildFilters() {
  const uniq = (key) => [...new Set(ALL.map(a => a[key]).filter(Boolean))].sort();
  fill('fy',  uniq('year'));
  fill('fc',  uniq('accClass'));
  fill('fd',  uniq('dept'));
}
function fill(id, vals) {
  const s = document.getElementById(id);
  vals.forEach(v => { const o=document.createElement('option'); o.value=o.textContent=v; s.appendChild(o); });
}
function v(id) { return document.getElementById(id).value; }

// ── 篩選 ────────────────────────────────────────────────────
function filt() {
  const fy=v('fy'), fq=v('fq'), fc=v('fc'), fd=v('fd');
  return ALL.filter(a =>
    (!fy || a.year===fy) && (!fq || a.quarter===fq) &&
    (!fc || a.accClass===fc) && (!fd || a.dept===fd)
  );
}
function rst() {
  ['fy','fq','fc','fd'].forEach(id => document.getElementById(id).value='');
  document.getElementById('tsrch').value='';
  pg=1; go();
}
function go() { const d=filt(); kpi(d); trend(d); dept(d); type_(d); frsr(); rtbl(); }
function setM(m) {
  mode=m;
  document.getElementById('bm').classList.toggle('on',m==='m');
  document.getElementById('bq').classList.toggle('on',m==='q');
  trend(filt());
}

// ── KPI ─────────────────────────────────────────────────────
function kpi(d) {
  s('k1', d.length);
  s('k2', d.filter(a=>a.restDays>0).length);
  const yr  = v('fy') || Object.keys(FRSR).sort().pop();
  const fy2 = FRSR[yr] || FRSR[Object.keys(FRSR).sort().pop()];
  const usedYr = v('fy') || Object.keys(FRSR).sort().pop();
  if (fy2) {
    s('k3', fy2.fr!==null ? fy2.fr : '—');
    s('k4', fy2.sr!==null ? fy2.sr : '—');
    s('k3s', usedYr+'年 · 每百萬工時');
    s('k4s', usedYr+'年 · 每百萬工時');
  }
}
function s(id,v2) { document.getElementById(id).textContent=v2; }

// ── 趨勢圖 ──────────────────────────────────────────────────
function trend(d) {
  const cnt={};
  d.forEach(a => { const k=mode==='m'?a.year+'-'+a.month:a.year+'-'+a.quarter; cnt[k]=(cnt[k]||0)+1; });
  const lbs=Object.keys(cnt).sort(), vs=lbs.map(k=>cnt[k]);
  bar('ctrend', lbs, vs, '事故件數', '#f97316');
}

// ── 部門圖 ──────────────────────────────────────────────────
function dept(d) {
  const cnt={};
  d.forEach(a=>{if(a.dept)cnt[a.dept]=(cnt[a.dept]||0)+1;});
  const sd=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,15);
  hbar('cdept', sd.map(x=>x[0]), sd.map(x=>x[1]));
}

// ── 類型圖 ──────────────────────────────────────────────────
function type_(d) {
  const cnt={};
  d.forEach(a=>{if(a.accType)cnt[a.accType]=(cnt[a.accType]||0)+1;});
  const sd=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const cols=['#f97316','#ef4444','#3b82f6','#8b5cf6','#10b981','#f59e0b','#06b6d4','#ec4899','#6366f1','#84cc16','#14b8a6','#f43f5e'];
  if(CH['ctype'])CH['ctype'].destroy();
  CH['ctype']=new Chart(document.getElementById('ctype'),{
    type:'doughnut',
    data:{labels:sd.map(x=>x[0]),datasets:[{data:sd.map(x=>x[1]),backgroundColor:cols,borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12,padding:8}},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed} 件`}}}}
  });
}

// ── FR/SR ────────────────────────────────────────────────────
function frsr() {
  const yrs=Object.keys(FRSR).sort();
  document.getElementById('ftbl').innerHTML=
    '<tr><th>年度</th><th>總件數</th><th>失能件數</th><th>失能日數</th><th>總工時（人時）</th><th>FR</th><th>SR</th></tr>'+
    yrs.map(y=>{const d=FRSR[y]; return `<tr>
      <td><b>${y}</b></td><td>${d.total}</td>
      <td class="vdi">${d.disabling}</td><td>${d.days}</td>
      <td>${d.hours.toLocaleString()}</td>
      <td class="vfr">${d.fr!==null?d.fr:'—'}</td>
      <td class="vsr">${d.sr!==null?d.sr:'—'}</td>
    </tr>`;}).join('');

  if(CH['cfrsr'])CH['cfrsr'].destroy();
  CH['cfrsr']=new Chart(document.getElementById('cfrsr'),{
    type:'bar',
    data:{labels:yrs,datasets:[
      {label:'FR',data:yrs.map(y=>FRSR[y].fr),backgroundColor:'#f9731688',borderColor:'#f97316',borderWidth:2,yAxisID:'yL'},
      {label:'SR',data:yrs.map(y=>FRSR[y].sr),backgroundColor:'#ef444488',borderColor:'#ef4444',borderWidth:2,yAxisID:'yR'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        yL:{position:'left', title:{display:true,text:'FR',font:{size:11}},beginAtZero:true},
        yR:{position:'right',title:{display:true,text:'SR',font:{size:11}},beginAtZero:true,grid:{drawOnChartArea:false}},
      },
      plugins:{legend:{labels:{font:{size:12}}}}}
  });
}

// ── 資料表 ──────────────────────────────────────────────────
function rtbl() {
  const q=document.getElementById('tsrch').value.toLowerCase();
  let rows=filt().filter(a=>!q||[a.dept,a.accType,a.accClass,a.location,a.name].some(v=>v.toLowerCase().includes(q)));
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  _dr = rows;
  const tot=rows.length;
  document.getElementById('tct').textContent='共 '+tot+' 筆';
  const tp=Math.max(1,Math.ceil(tot/PG)); if(pg>tp)pg=tp;
  document.getElementById('tbody').innerHTML=rows.slice((pg-1)*PG,pg*PG).map((a,i)=>`
    <tr title="點擊查看完整資料" onclick="openDtl(${(pg-1)*PG+i})">
      <td>${a.date}</td><td>${a.dept}</td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${a.location}">${a.location}</td>
      <td><span class="bd ${a.accClass.includes('交通')?'bd-b':a.accClass.includes('虛驚')?'bd-o':'bd-r'}">${a.accClass}</span></td>
      <td>${a.accType}</td>
      <td>${a.restDays>0?'<span class="dv">'+a.restDays+' 天</span>':'—'}</td>
      <td><span class="bd ${a.punished==='是'?'bd-o':'bd-g'}">${a.punished}</span></td>
      <td style="color:var(--sub);font-size:11px;text-align:right">詳情 ›</td>
    </tr>`).join('');

  const pr=document.getElementById('pgr');
  if(tp<=1){pr.innerHTML='';return;}
  let h=pg>1?`<button onclick="gp(${pg-1})">‹</button>`:'';
  for(let p=Math.max(1,pg-2);p<=Math.min(tp,pg+2);p++)
    h+=`<button class="${p===pg?'on':''}" onclick="gp(${p})">${p}</button>`;
  if(pg<tp)h+=`<button onclick="gp(${pg+1})">›</button>`;
  h+=`<span class="pgi">${pg}/${tp} 頁</span>`;
  pr.innerHTML=h;
}
function gp(p){pg=p;rtbl();}

// ── 通用圖表 ────────────────────────────────────────────────

function closeDtl() {
  document.getElementById('dtl-bg').classList.remove('open');

// ── AI 根因分析 ────────────────────────────────────────────────
const RISK_WORKER = 'https://ohs-law-chatbot.df-hr-openai.workers.dev';
const UNSAFE_BEHAVIORS = ['運轉中設備維護','使用設備不當','使安全裝置失效','胡亂喧鬧','未使用保護或警告措施','未使用個人防護裝備','穿戴不安全衣飾','使用手或肢體不當','不注意立足處','不安全的放置、混合、結合','採取不安全的動作，姿勢或位置','駕駛疏忽','以不安全的速度操作','採用不安全的設備（設備有缺陷）','其他'];
const UNSAFE_CONDITIONS = ['工具、設備或物料有缺陷','防護不足或不當','佈置的危害','危險的方法或程序','工作環境以外的危害','警示系統不足','環境的危害','公共危害（交通）','其他'];
const ROOT_CAUSES_LIST = ['缺乏知識或技能','身體不能適應','心智不適應','不適當的態度','不適當之機械或物質環境','不符合工作標準','工具或設備不足','壓力或疲勞','其他'];
let _dtlAcc = null;

function _renderAiInitial(a) {
  let saved = null;
  try { if (a.aiAnalysis) saved = JSON.parse(a.aiAnalysis); } catch(e){}
  if (saved) return _renderAiResult(saved, true);
  return `<button type="button" class="ai-gen-btn" onclick="runAiAnalysis()">🤖 AI 分析此事故</button>`;
}

function _renderAiResult(data, isSaved) {
  const whyHtml = (data.fiveWhy || []).map((w, i) => `
    <div class="ai-5why-row">
      <div class="ai-5why-num">${i+1}</div>
      <div>
        <div class="ai-5why-q">${_esc(w.q)}</div>
        <div class="ai-5why-a">${_esc(w.a)}</div>
      </div>
    </div>`).join('');

  const imp = data.improvements || {};
  const dimCards = `
    <div class="ai-dim-grid">
      <div class="ai-dim-card ai-dim-eng">
        <div class="ai-dim-title">🔧 工程改善</div>
        ${(imp.engineering||[]).map(t=>`<div class="ai-dim-item">${_esc(t)}</div>`).join('')}
      </div>
      <div class="ai-dim-card ai-dim-mgmt">
        <div class="ai-dim-title">📋 管理改善</div>
        ${(imp.management||[]).map(t=>`<div class="ai-dim-item">${_esc(t)}</div>`).join('')}
      </div>
      <div class="ai-dim-card ai-dim-train">
        <div class="ai-dim-title">📚 教育訓練</div>
        ${(imp.training||[]).map(t=>`<div class="ai-dim-item">${_esc(t)}</div>`).join('')}
      </div>
    </div>`;

  const actionRow = isSaved
    ? `<div class="ai-save-row">
         <span class="ai-saved-tag">✅ 已儲存${data.generatedAt ? '（'+data.generatedAt+'）' : ''}</span>
         <button type="button" class="ai-regen-btn" onclick="runAiAnalysis()">🔄 重新生成</button>
       </div>`
    : `<div class="ai-save-row">
         <button type="button" class="ai-save-btn" id="ai-save-btn" onclick="saveAiAnalysis()">💾 儲存分析</button>
         <button type="button" class="ai-regen-btn" onclick="runAiAnalysis()">🔄 重新生成</button>
       </div>`;

  return `
    <div class="ai-sub-lbl">5 Why 根本原因推演</div>
    <div class="ai-5why">${whyHtml}</div>
    <div class="ai-sub-lbl">預防再發三維度改善建議</div>
    ${dimCards}${actionRow}`;
}

async function runAiAnalysis() {
  const a = _dtlAcc; if (!a) return;
  const body = document.getElementById('ai-sec-body'); if (!body) return;
  body.innerHTML = `<div style="color:var(--sub);font-size:13px;padding:10px 0">⏳ AI 分析中，請稍候…</div>`;

  const prompt = `你是職業安全衛生分析專家。請分析以下職業災害，輸出結構化的根因分析結果。

【事故資料】
日期：${a.date}，部門：${a.dept}，地點：${a.location}
事故分類：${a.accClass}，事故類型：${a.accType}
描述：${a.description || '（無）'}
不安全行為（原填）：${a.unsafeBehavior || '（無）'}
不安全狀況（原填）：${a.unsafeCondition || '（無）'}
基本原因（原填）：${a.rootCause || '（無）'}

【不安全行為選項15項】：${UNSAFE_BEHAVIORS.join(' / ')}
【不安全狀況選項9項】：${UNSAFE_CONDITIONS.join(' / ')}
【基本原因選項9項】：${ROOT_CAUSES_LIST.join(' / ')}

只回傳 JSON，不要加任何說明文字（繁體中文）：
{
  "fiveWhy": [
    {"q":"為什麼發生此事故？","a":"..."},
    {"q":"為什麼...？","a":"..."},
    {"q":"為什麼...？","a":"..."},
    {"q":"為什麼...？","a":"..."},
    {"q":"根本原因是？","a":"..."}
  ],
  "improvements": {
    "engineering": ["具體工程改善措施1","2"],
    "management": ["管理改善措施1","2"],
    "training": ["教育訓練措施1","2"]
  }
}`;

  try {
    const resp = await fetch(RISK_WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: prompt })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();
    const raw = (d.data || d.text || '').replace(/```json\n?|```\n?/g, '').trim();
    const m = raw.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('無法解析回應');
    const parsed = JSON.parse(m[0]);
    parsed.generatedAt = new Date().toISOString().slice(0, 10);
    a._pendingAi = parsed;
    body.innerHTML = _renderAiResult(parsed, false);
  } catch(e) {
    body.innerHTML = `<div style="color:var(--red);font-size:13px;margin-bottom:8px">❌ 分析失敗：${_esc(e.message)}</div>
      <button type="button" class="ai-gen-btn" onclick="runAiAnalysis()">重試</button>`;
    console.error('[runAiAnalysis]', e);
  }
}

async function saveAiAnalysis() {
  const a = _dtlAcc; if (!a) return;
  const data = a._pendingAi; if (!data) return;
  const btn = document.getElementById('ai-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 儲存中…'; }
  try {
    const res = await fetch(DATA_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'saveAnalysis', date: a.date, empId: a.empId, analysis: JSON.stringify(data) })
    });
    const j = await res.json();
    if (j.ok) {
      a.aiAnalysis = JSON.stringify(data);
      a._pendingAi = null;
      document.getElementById('ai-sec-body').innerHTML = _renderAiResult(data, true);
    } else {
      throw new Error(j.error || '未知錯誤');
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '💾 儲存分析'; }
    alert('儲存失敗：' + e.message);
    console.error('[saveAiAnalysis]', e);
  }
}

init();
</script>
